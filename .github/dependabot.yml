## Dependency updates.
##
## Dependabot rather than Renovate: free on private repos, and the grouping here
## is simple enough not to need Renovate's expressiveness.
##
## Patch and minor updates for dev tooling are grouped into one weekly PR so
## that reviewing them is a single task rather than twenty. Anything touching
## security-critical surfaces (§2.2) is deliberately left ungrouped and
## unmerged automatically — crypto, database driver, and auth libraries get read
## individually.

version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tooling:
        patterns:
          - 'eslint*'
          - '@eslint/*'
          - 'typescript-eslint'
          - 'prettier*'
          - 'vitest'
          - '@vitest/*'
          - 'turbo'
          - 'tsx'
        update-types:
          - minor
          - patch
      types:
        patterns:
          - '@types/*'
        update-types:
          - minor
          - patch
    ignore:
      # Security-critical dependencies are reviewed one at a time, never in a
      # grouped bulk PR. Dependabot still opens individual PRs for these.
      - dependency-name: pg
        update-types: ['version-update:semver-major']
      - dependency-name: drizzle-orm
        update-types: ['version-update:semver-major']

  ## The third-party images in compose.prod.yaml are pinned by digest, which is
  ## what makes them reproducible — and also what makes them go stale silently,
  ## since a digest never moves and a security fix published under the same tag
  ## never reaches us. This entry is the other half: Dependabot watches the tag
  ## each pin names and opens a PR when the publisher re-points it, so an
  ## upstream update becomes a diff someone reviews rather than a pull nobody
  ## noticed. Pinning without watching would trade one silent failure for
  ## another.
  ##
  ## Ungrouped on purpose. Four images is not a review burden, and MinIO holds
  ## every uploaded file while coturn relays media on this deployment's bill —
  ## neither belongs in a bulk PR that gets skimmed.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns:
          - '*'
