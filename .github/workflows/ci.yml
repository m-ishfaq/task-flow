## CI gate suite (PLAN.md §11)
##
## A high or critical security finding fails the build. There is no bypass flag.
##
## ---------------------------------------------------------------------------
## MINUTE BUDGET
##
## This repository is private, so Actions minutes are metered: 2,000/month (§16).
## Billing is the SUM of every job's duration, each rounded UP to a whole minute
## — five jobs finishing in 20s each still costs 5 minutes, not 20 seconds. Job
## COUNT matters as much as job duration.
##
## During Phase 0-4 development the primary gate is local: `pnpm preflight`
## reproduces every check here in one command. CI is the backstop, so the
## expensive scanners do not need to run on every push.
##
## Tiering. A push straight to main and a PR into main behave IDENTICALLY —
## both are decided by the two variables below, and nothing keys off which one
## it was:
##
##   main (push or PR), CI_SECURITY_ALWAYS unset   verify only     ~3 min
##   main (push or PR), CI_SECURITY_ALWAYS=true    everything     ~12 min
##   weekly schedule                               everything     ~12 min
##   manual dispatch                               your choice
##   anything, CI_ENABLED=false                    nothing         0 min
##
## The scanners used to run on every PR regardless. That was dropped in favour
## of one rule that holds everywhere, because the previous split meant the
## answer to "did anything scan this commit?" depended on how it reached main —
## and the merge path is not a security property. The weekly sweep is what still
## catches a commit nobody scanned, so do not remove it while the default is off.
##
## Controls (Settings -> Secrets and variables -> Actions -> Variables):
##   CI_ENABLED=false         kill switch — skips ALL jobs, no minutes spent
##   CI_SECURITY_ALWAYS=true  run the scanners, on a push to main and on a PR alike
##
## Both are repository VARIABLES, not secrets, so they can be flipped in the UI
## without touching code. Turn scanners back on permanently before launch.
##
## Both DEFAULT TO THE SAFE ANSWER when unset, and the polarity is chosen for
## that rather than for readability: CI_ENABLED is tested with `!= 'false'`, so
## an unset variable runs CI. The alternative — `== 'true'`, meaning nobody has
## set it yet and nothing runs — is the failure this repo keeps finding
## elsewhere: a protection that is present, looks fine, and matches nothing.
## A CI that silently does not run is indistinguishable from a CI that passes.
##
## Only the literal strings 'false' and 'true' mean anything. Any other value,
## including an empty one, leaves the default in place.
## ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
    # Documentation-only commits cannot break the build; skip them entirely.
    paths-ignore:
      - '**.md'
      - 'ai/**'
      - 'docs/**'
      - '.vscode/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
  # Weekly security sweep. Catches newly-published advisories against code that
  # has not changed — the case per-push scanning would never find anyway.
  schedule:
    - cron: '0 3 * * 1' # Mondays 03:00 UTC
  workflow_dispatch:
    inputs:
      run_security:
        description: 'Run the security scan jobs (secrets, SAST, deps, Trivy)'
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must stay >= 22.12.0 and in sync with .node-version and package.json engines.
  #
  # rolldown (via vitest 3) requires ^20.19.0 || >=22.12.0. This was pinned to
  # 22.11.0 — one patch below that floor — and pnpm SILENTLY SKIPS an optional
  # dependency whose engines do not match. The native binding was simply never
  # installed, and the failure surfaced much later as "Cannot find native
  # binding" during tests, with nothing pointing at the Node version.
  #
  # package.json now declares engines >= 22.12.0 with engine-strict enabled, so
  # a future drift fails loudly at install instead.
  NODE_VERSION: '22.23.1'
  PNPM_VERSION: '9.15.9'

jobs:
  # ---------------------------------------------------------------------------
  # Correctness — lint, types, unit + integration tests against real Postgres.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, test
    # Runs on every trigger except when the kill switch is set. This is the job
    # that actually catches broken code, so it is never tiered away.
    if: vars.CI_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow
        ports:
          # Matches compose.yaml. The runner has no competing Postgres, so 5432
          # would work here — but the test fallbacks are shared with local
          # development, and a CI that listens somewhere else is a CI that only
          # passes because every suite happened to read the env vars below.
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # TEST_* for the suites, which run against `taskflow_test` — a separate
      # database, because they truncate what they touch (see 04-test-database.sql).
      # Deliberately different NAMES, not just different values: were these called
      # DATABASE_URL, anything that later taught the suites to read a .env would
      # silently aim them back at the developer's own data.
      TEST_DATABASE_URL: postgresql://taskflow_app:app-dev-secret@localhost:5433/taskflow_test
      TEST_DATABASE_MIGRATION_URL: postgresql://taskflow_migrator:migrator-dev-secret@localhost:5433/taskflow_test
      TEST_DATABASE_AUDIT_URL: postgresql://taskflow_audit:audit-dev-secret@localhost:5433/taskflow_test

      # For `migrate:verify`. It reverts every migration before re-applying them,
      # so it drops every table — aimed at `taskflow` it is a full wipe, which is
      # harmless on a throwaway CI container and destroyed a developer's own data
      # locally. The runner now refuses any database not named `*_test`; this is
      # set explicitly so CI states its target rather than inheriting a default.
      DATABASE_VERIFY_URL: postgresql://taskflow_migrator:migrator-dev-secret@localhost:5433/taskflow_test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The service container cannot mount our init scripts, so the roles and
      # extensions are applied explicitly. Same files as local dev, so the two
      # environments cannot drift.
      - name: Initialize database roles and extensions
        run: |
          for f in docker/postgres/init/*.sql; do
            echo "applying $f"
            PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d taskflow -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # A BOM in package.json broke pnpm/action-setup with a JSON syntax error
      # that pointed nowhere near the actual cause. CRLF in a `run: |` block
      # fails in bash the same way. Both are trivially introduced from Windows.
      - name: Encoding check (no BOM, no CRLF)
        run: node scripts/check-encoding.mjs

      # Lives here, not the tiered `secrets` job below, for the identical
      # reason the encoding check does: gitleaks only runs with
      # CI_SECURITY_ALWAYS set, on the weekly schedule, or on manual dispatch,
      # so a check gated the same way would not run on the default path at
      # all. This is an allowlist of what apps/mobile's config surface may
      # embed, not shape-based secret detection — see the script's own header
      # for why that is not redundant with gitleaks.
      - name: Mobile bundle config (no disallowed keys)
        run: node scripts/check-mobile-bundle-secrets.mjs

      # tsc and eslint both understand this repo's NodeNext-style `.js`
      # imports against `.ts` source files; Metro's own resolver does not
      # unless metro.config.js says so. A route with a typo'd or
      # unresolvable import passes lint and typecheck cleanly and only fails
      # here — found the hard way when every screen in apps/mobile/app
      # failed an actual `expo export` despite a fully green `pnpm verify`.
      # `dist/` is gitignored; this proves the bundle builds, not a
      # deployable artifact.
      - name: Mobile bundles (expo export)
        run: pnpm --filter @taskflow/mobile build

      - name: Format check
        run: pnpm format:check

      - name: Lint, typecheck, test
        run: pnpm verify

      # Explicit, separate from `pnpm verify`, because a silently-dead guardrail
      # is the failure this whole architecture is built to prevent (§2.3).
      - name: Guardrail self-test
        run: node packages/guardrail-selftest/verify.js

      # Lives in THIS job, not the tiered `sast` one below. A tenant table
      # without FORCE RLS is the single highest-impact mistake in the system, and
      # gating it behind CI_SECURITY_ALWAYS means the default configuration does
      # not check it. Pure Node — no database, no scanner image, no minutes worth
      # saving. Was a Semgrep rule until generic-mode ellipsis spans made it
      # report every correct migration; see .semgrep/taskflow.yml.
      - name: Migration RLS invariants
        run: node scripts/check-migration-rls.mjs

      - name: Migrations are reversible (up -> down -> up)
        run: pnpm --filter @taskflow/db migrate:verify

      # Proves RLS isolates and fails closed against the real engine.
      - name: RLS isolation probe
        run: |
          PGPASSWORD=postgres psql -h localhost -p 5433 -U postgres -d taskflow \
            -v ON_ERROR_STOP=1 -f docker/postgres/rls-probe.sql

  # ---------------------------------------------------------------------------
  # Secrets. Runs first-class rather than as part of another job: a leaked
  # credential needs to be visible even when the build is broken for other
  # reasons.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    # Tiered — see the minute-budget note at the top of this file.
    if: >-
      vars.CI_ENABLED != 'false' &&
      ( vars.CI_SECURITY_ALWAYS == 'true'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_security) )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # Run via a pinned image rather than the marketplace action.
      # Marketplace action versions cannot be verified locally before pushing,
      # and two of them (osv-scanner-action@v1, trivy-action@0.28.0) failed this
      # workflow on first run with "unable to find version". A pinned image is
      # testable with the exact same command on a laptop.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

  # ---------------------------------------------------------------------------
  # Static analysis. Semgrep OSS stands in for CodeQL, which needs GitHub
  # Advanced Security on private repos (§8.8). Custom rules matching this
  # architecture matter more here than generic taint rules.
  # ---------------------------------------------------------------------------
  sast:
    name: Static analysis
    if: >-
      vars.CI_ENABLED != 'false' &&
      ( vars.CI_SECURITY_ALWAYS == 'true'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_security) )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT `container: semgrep/semgrep` — that image has no Node, so
    # the rule verifier below cannot run inside it. Installing semgrep onto a
    # standard runner gives both tools on one PATH.
    env:
      SEMGREP_ON_PATH: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install --quiet semgrep

      # Runs BEFORE the real scan. The custom rules encode this project's
      # highest-impact invariants (tenant tables without FORCE RLS, policies
      # missing NULLIF or WITH CHECK), and a rule that silently matches nothing
      # would leave the scan green while protecting nothing.
      - name: Verify custom rules actually fire
        run: node scripts/verify-semgrep-rules.mjs

      # Explicit rulesets rather than `--config auto`: auto resolves rules from
      # the registry and REQUIRES metrics to be enabled, so it cannot be combined
      # with --metrics=off. Naming the packs also keeps scans reproducible
      # instead of silently changing when the registry does.
      #
      # .semgrep/fixtures is deliberately-wrong SQL used by the check above, so
      # it must not count as a finding here.
      - name: Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --config .semgrep/taskflow.yml \
            --exclude '.semgrep/fixtures' \
            --exclude 'packages/guardrail-selftest' \
            --error \
            --skip-unknown-extensions \
            --metrics=off

  # ---------------------------------------------------------------------------
  # Dependencies. Fails on high or critical only — moderate findings in
  # transitive dev dependencies would otherwise block every PR without
  # improving anything.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency audit
    if: >-
      vars.CI_ENABLED != 'false' &&
      ( vars.CI_SECURITY_ALWAYS == 'true'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_security) )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Covers dev dependencies, which Trivy deliberately skips. Suppressions
      # live in package.json > pnpm.auditConfig.ignoreGhsas and must each be
      # justified in ai/dependency-exceptions.md.
      - name: pnpm audit
        run: pnpm audit --audit-level high

      # OSV-Scanner was dropped here rather than fixed. It scans the same
      # pnpm-lock.yaml that `pnpm audit` already covers, so it added a third
      # overlapping npm advisory source while Trivy (next job) covers runtime
      # dependencies, secrets, and — once there is IaC — misconfiguration.
      # Reconsider if we ever add a non-npm ecosystem.

  # ---------------------------------------------------------------------------
  # Filesystem/config scan, now including Dockerfile misconfiguration
  # (ai/pre-launch-hardening.md Priority 1 added the four apps/*/Dockerfile).
  # Terraform scanning joins this job if IaC is ever added.
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy
    if: >-
      vars.CI_ENABLED != 'false' &&
      ( vars.CI_SECURITY_ALWAYS == 'true'
        || github.event_name == 'schedule'
        || (github.event_name == 'workflow_dispatch' && inputs.run_security) )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Trivy downloads a ~50MB vulnerability database on every cold run, which
      # was the bulk of this job's billed time. Caching it cuts the job roughly
      # in half.
      - name: Cache Trivy database
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.trivycache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      # Pinned image, same reasoning as the gitleaks job above.
      #
      # Trivy suppresses dev dependencies by design, so this complements rather
      # than duplicates `pnpm audit`: Trivy covers what ships, pnpm audit covers
      # the toolchain.
      #
      # `misconfig` now has something to scan: the four apps/*/Dockerfile
      # this repo added for deployment (ai/pre-launch-hardening.md Priority
      # 1). It was omitted until then — with zero config files present it
      # found nothing and only emitted rego parse noise.
      - name: Trivy filesystem scan
        run: |
          mkdir -p "${{ github.workspace }}/.trivycache"
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -v "${{ github.workspace }}/.trivycache:/root/.cache/trivy" \
            aquasec/trivy:0.58.1 \
            fs /repo \
              --scanners vuln,secret,misconfig \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --skip-dirs /repo/.trivycache \
              --no-progress
