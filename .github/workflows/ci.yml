## CI gate suite (PLAN.md §11)
##
## Every job here must pass to merge. The security jobs are not advisory — a high
## or critical finding fails the build, and there is no bypass flag.
##
## Budget note: this repository is private, so Actions minutes are metered
## (§16). Linux runners only — Windows bills 2x and macOS 10x. Turborepo caching
## keeps unchanged packages from rebuilding.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Must stay >= 22.12.0 and in sync with .node-version and package.json engines.
  #
  # rolldown (via vitest 3) requires ^20.19.0 || >=22.12.0. This was pinned to
  # 22.11.0 — one patch below that floor — and pnpm SILENTLY SKIPS an optional
  # dependency whose engines do not match. The native binding was simply never
  # installed, and the failure surfaced much later as "Cannot find native
  # binding" during tests, with nothing pointing at the Node version.
  #
  # package.json now declares engines >= 22.12.0 with engine-strict enabled, so
  # a future drift fails loudly at install instead.
  NODE_VERSION: '22.23.1'
  PNPM_VERSION: '9.15.9'

jobs:
  # ---------------------------------------------------------------------------
  # Correctness — lint, types, unit + integration tests against real Postgres.
  # ---------------------------------------------------------------------------
  verify:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: taskflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d taskflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://taskflow_app:app-dev-secret@localhost:5432/taskflow
      DATABASE_MIGRATION_URL: postgresql://taskflow_migrator:migrator-dev-secret@localhost:5432/taskflow

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The service container cannot mount our init scripts, so the roles and
      # extensions are applied explicitly. Same files as local dev, so the two
      # environments cannot drift.
      - name: Initialize database roles and extensions
        run: |
          for f in docker/postgres/init/*.sql; do
            echo "applying $f"
            PGPASSWORD=postgres psql -h localhost -U postgres -d taskflow -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Format check
        run: pnpm format:check

      - name: Lint, typecheck, test
        run: pnpm verify

      # Explicit, separate from `pnpm verify`, because a silently-dead guardrail
      # is the failure this whole architecture is built to prevent (§2.3).
      - name: Guardrail self-test
        run: node packages/guardrail-selftest/verify.js

      - name: Migrations are reversible (up -> down -> up)
        run: pnpm --filter @taskflow/db migrate:verify

      # Proves RLS isolates and fails closed against the real engine.
      - name: RLS isolation probe
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d taskflow \
            -v ON_ERROR_STOP=1 -f docker/postgres/rls-probe.sql

  # ---------------------------------------------------------------------------
  # Secrets. Runs first-class rather than as part of another job: a leaked
  # credential needs to be visible even when the build is broken for other
  # reasons.
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans history, not just the tip

      # Run via a pinned image rather than the marketplace action.
      # Marketplace action versions cannot be verified locally before pushing,
      # and two of them (osv-scanner-action@v1, trivy-action@0.28.0) failed this
      # workflow on first run with "unable to find version". A pinned image is
      # testable with the exact same command on a laptop.
      - name: gitleaks
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose

  # ---------------------------------------------------------------------------
  # Static analysis. Semgrep OSS stands in for CodeQL, which needs GitHub
  # Advanced Security on private repos (§8.8). Custom rules matching this
  # architecture matter more here than generic taint rules.
  # ---------------------------------------------------------------------------
  sast:
    name: Static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Deliberately NOT `container: semgrep/semgrep` — that image has no Node, so
    # the rule verifier below cannot run inside it. Installing semgrep onto a
    # standard runner gives both tools on one PATH.
    env:
      SEMGREP_ON_PATH: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install semgrep
        run: pip install --quiet semgrep

      # Runs BEFORE the real scan. The custom rules encode this project's
      # highest-impact invariants (tenant tables without FORCE RLS, policies
      # missing NULLIF or WITH CHECK), and a rule that silently matches nothing
      # would leave the scan green while protecting nothing.
      - name: Verify custom rules actually fire
        run: node scripts/verify-semgrep-rules.mjs

      # Explicit rulesets rather than `--config auto`: auto resolves rules from
      # the registry and REQUIRES metrics to be enabled, so it cannot be combined
      # with --metrics=off. Naming the packs also keeps scans reproducible
      # instead of silently changing when the registry does.
      #
      # .semgrep/fixtures is deliberately-wrong SQL used by the check above, so
      # it must not count as a finding here.
      - name: Semgrep
        run: |
          semgrep scan \
            --config p/typescript \
            --config p/security-audit \
            --config p/secrets \
            --config .semgrep/taskflow.yml \
            --exclude '.semgrep/fixtures' \
            --error \
            --skip-unknown-extensions \
            --metrics=off

  # ---------------------------------------------------------------------------
  # Dependencies. Fails on high or critical only — moderate findings in
  # transitive dev dependencies would otherwise block every PR without
  # improving anything.
  # ---------------------------------------------------------------------------
  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Covers dev dependencies, which Trivy deliberately skips. Suppressions
      # live in package.json > pnpm.auditConfig.ignoreGhsas and must each be
      # justified in ai/dependency-exceptions.md.
      - name: pnpm audit
        run: pnpm audit --audit-level high

      # OSV-Scanner was dropped here rather than fixed. It scans the same
      # pnpm-lock.yaml that `pnpm audit` already covers, so it added a third
      # overlapping npm advisory source while Trivy (next job) covers runtime
      # dependencies, secrets, and — once there is IaC — misconfiguration.
      # Reconsider if we ever add a non-npm ecosystem.

  # ---------------------------------------------------------------------------
  # Filesystem/config scan. Container and IaC scanning join this job once there
  # are Dockerfiles and Terraform to scan (Phase 0B).
  # ---------------------------------------------------------------------------
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Pinned image, same reasoning as the gitleaks job above.
      #
      # Trivy suppresses dev dependencies by design, so this complements rather
      # than duplicates `pnpm audit`: Trivy covers what ships, pnpm audit covers
      # the toolchain.
      #
      # `misconfig` is intentionally omitted until there are Dockerfiles and
      # Terraform to scan (Phase 0B) — today it finds zero config files and only
      # emits rego parse noise. Add it back with the IaC.
      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "${{ github.workspace }}:/repo" \
            aquasec/trivy:0.58.1 \
            fs /repo \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --no-progress
