## CD — build/push images and (optionally) deploy (ai/pre-launch-hardening.md
## Priority 1; ai/deployment-runbook.md).
##
## Runs after CI (`workflow_run`, gated on `conclusion == 'success'`) rather
## than on its own `push` trigger — this repo never deploys something CI did
## not pass, and a separate `push`-triggered workflow racing CI would make
## that guarantee accidental instead of structural.
##
## Three jobs, gated by TWO independent signals from `changes` (see its own
## header below) rather than one: `images` (does anything need rebuilding)
## and `deploy` (does the server need updating). They are not the same
## question — compose.prod.yaml and docker/postgres/ are real deploy-time
## inputs (`deploy` copies them to the server) but never reach a built image,
## so a change to only those should update the server without rebuilding and
## pushing five images that would come out byte-identical.
##
## `build-push` runs when `images` is true and publishes five images to GHCR,
## tagged with the commit SHA and `latest`. `deploy` runs when `deploy` is
## true, whether or not `build-push` ran alongside it — when it did not (a
## compose/docker-postgres-only push), there is no fresh SHA-tagged image for
## this commit to pull, so it deploys `latest` instead; see its own IMAGE_TAG
## comment. `deploy` is a NO-OP — not a failure — when
## DEPLOY_HOST/DEPLOY_SSH_KEY/DEPLOY_USER repo secrets are unset.

name: CD

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  # No cancel-in-progress: a deploy that gets interrupted mid-`compose up`
  # can leave the target host with a partially-recreated stack, which is a
  # worse state than a slightly-stale queued run finishing first.
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  NODE_VERSION: '22.23.1'
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # Two POSITIVE allowlists, not a blacklist of things that don't matter —
  # the inverse is unmaintainable, since every doc, workflow, or config file
  # anyone ever adds would need to join it by hand or silently start
  # triggering rebuilds again. `images` names exactly what `build-push`
  # consumes, confirmed against every apps/*/Dockerfile's own COPY list: the
  # root manifests (package.json, pnpm-lock.yaml, pnpm-workspace.yaml,
  # .npmrc), patches/, packages/ (every image carries the full workspace
  # source), and each of the five apps/{api,realtime,collab,web,worker}
  # directories. `deploy` is that same set PLUS compose.prod.yaml and
  # docker/postgres/ — real inputs to the `deploy` job's server sync, but
  # never copied into an image, so they belong in the wider set and not the
  # narrower one. apps/mobile ships through EAS, not GHCR, so it was never in
  # either set — it just no longer needs its own special case to say so, and
  # neither does the next file that isn't relevant to either job.
  #
  # Skipping build-push is an optimization only: a push outside `images`
  # still passes CI and would produce byte-identical images to the ones
  # already published for the previous main tip, at the cost of ~4 minutes
  # and a needless registry write per service. `git diff HEAD~1 HEAD` is
  # exactly the set of files this push introduced to main —
  # `actions/checkout`'s `fetch-depth: 2` is what makes `HEAD~1` resolvable
  # at all, since a default checkout is a single-commit shallow clone.
  # `workflow_dispatch` (a manual, deliberate "build everything" run) and
  # CI_ENABLED's own kill switch both bypass the diff entirely rather than
  # trying to reason about which commit a manual trigger should compare
  # against.
  #
  # `sha` is resolved once here — "the commit CI actually verified" — rather
  # than separately inside build-push, because `deploy` needs it too and
  # cannot always get it from build-push's own output: build-push may be
  # skipped entirely (a compose/docker-postgres-only push), in which case it
  # has no output to read at all.
  changes:
    name: Detect changes relevant to a build or deploy
    runs-on: ubuntu-latest
    if: >-
      vars.CI_ENABLED != 'false' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    outputs:
      images: ${{ steps.filter.outputs.images }}
      deploy: ${{ steps.filter.outputs.deploy }}
      sha: ${{ steps.resolve-ref.outputs.sha }}
    steps:
      - name: Resolve the commit CI actually verified
        id: resolve-ref
        run: echo "sha=${{ github.event.workflow_run.head_sha || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve-ref.outputs.sha }}
          fetch-depth: 2

      - name: Diff this push against the previous main tip
        id: filter
        run: |
          if [ "${{ github.event_name }}" = 'workflow_dispatch' ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD~1 HEAD)"
          echo "$changed"
          # deploy_pattern is images_pattern's alternatives plus the two
          # deploy-only paths, spelled out in full rather than derived by
          # string surgery on images_pattern — a later edit to one is
          # visible in a diff of both, not a break in whichever is derived.
          images_pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|patches/|packages/|apps/(api|realtime|collab|web|worker)/)'
          deploy_pattern='^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|\.npmrc|patches/|packages/|apps/(api|realtime|collab|web|worker)/|compose\.prod\.yaml|docker/postgres/)'
          if echo "$changed" | grep -qE "$images_pattern"; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -qE "$deploy_pattern"; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build & push (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # fail-fast: false — the five images have independent base images and
      # independent Trivy findings (found live: web's nginx-unprivileged
      # base carries Alpine OS-package CVEs the node:22-alpine-based images
      # never see). The default fail-fast cancels every sibling the instant
      # one fails, which reads as "4 unknown" rather than "4 clean" and
      # hides a real finding on any image but whichever fails first.
      fail-fast: false
      matrix:
        # Five images, not four: compose.prod.yaml's `worker` service has its
        # own dedicated task-flow-worker image (apps/worker/Dockerfile) —
        # `migrate` is the only service that reuses another image (api's)
        # rather than needing its own. Found live: a real `docker compose
        # pull` against a real deployment failing "denied" on
        # task-flow-worker, because this matrix never built or pushed it —
        # `docker compose config`/build never catch a tag that simply
        # doesn't exist in the registry yet.
        service: [api, realtime, collab, web, worker]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_OWNER }}/task-flow-${{ matrix.service }}:${{ needs.changes.outputs.sha }}
            ghcr.io/${{ env.IMAGE_OWNER }}/task-flow-${{ matrix.service }}:latest
          # Scoped per service — a shared cache key across four independent
          # Dockerfiles would mean api's cache entries evicting web's.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # CI's Trivy job scans the repository FILESYSTEM — source and the
      # lockfile. It never sees a built image, so nothing in the pipeline was
      # looking at the base images these are built on, or at anything the
      # Dockerfile installs. PLAN.md §8.8 asks for container scanning; this is
      # the half that was missing.
      #
      # Runs after the push, against the tag just published, so it scans the
      # exact bytes that will be deployed rather than a local rebuild that
      # might differ. Fails the job on HIGH or CRITICAL, matching CI's own
      # Trivy step and §8.8's "any high or critical finding fails the build".
      # Via a pinned image rather than the marketplace action, and the same
      # `aquasec/trivy:0.58.1` CI's filesystem scan uses — CI's own note
      # records that `trivy-action@0.28.0` failed this workflow on first run
      # with "unable to find version", and that a pinned image is testable with
      # the identical command on a laptop.
      - name: Trivy image scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1 \
            image "ghcr.io/${IMAGE_OWNER}/task-flow-${SERVICE}:${IMAGE_SHA}" \
              --severity HIGH,CRITICAL \
              --exit-code 1 \
              --ignore-unfixed \
              --no-progress
        env:
          IMAGE_OWNER: ${{ env.IMAGE_OWNER }}
          SERVICE: ${{ matrix.service }}
          IMAGE_SHA: ${{ needs.changes.outputs.sha }}

  deploy:
    name: Deploy
    needs: [changes, build-push]
    # Runs whenever `changes` says the server needs updating, INCLUDING when
    # build-push was legitimately skipped (a compose/docker-postgres-only push
    # rebuilds nothing). `!cancelled()` is load-bearing and used to be missing:
    # GitHub skips a job whose `needs` includes a SKIPPED job UNLESS the `if`
    # contains a status function, so an `if` that only references
    # `build-push.result` is NOT enough to "opt out of the default" — the deploy
    # job skipped anyway on every deploy-only push, and the first such push (the
    # postgres digest pin) merged green while never reaching the server. Proven
    # against a real run: `changes` emitted `deploy=true` and the Deploy job
    # still skipped. `!cancelled()` makes GitHub evaluate this `if` instead of
    # skip-propagating; `build-push.result != 'failure'` still blocks deploy on a
    # real build FAILURE while allowing success, skipped, and the empty-result
    # matrix case a fully-skipped build-push can produce.
    if: >-
      !cancelled() &&
      needs.changes.outputs.deploy == 'true' &&
      needs.build-push.result != 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check whether a deploy target is configured
        id: gate
        env:
          HAS_HOST: ${{ secrets.DEPLOY_HOST != '' }}
          HAS_KEY: ${{ secrets.DEPLOY_SSH_KEY != '' }}
          HAS_USER: ${{ secrets.DEPLOY_USER != '' }}
        run: |
          if [ "$HAS_HOST" = 'true' ] && [ "$HAS_KEY" = 'true' ] && [ "$HAS_USER" = 'true' ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No deploy target configured (DEPLOY_HOST / DEPLOY_SSH_KEY / DEPLOY_USER repo secrets are unset) — images were pushed to GHCR and nothing more happened. See ai/deployment-runbook.md to configure a target host."
          fi

      # Checked out here, not just in build-push: this job runs on a separate
      # runner with no shared filesystem, and it needs compose.prod.yaml/
      # docker/postgres as real local files to copy in the step below.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.configured == 'true'
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - uses: webfactory/ssh-agent@v0.9.0
        if: steps.gate.outputs.configured == 'true'
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      # Pushed from the runner rather than pulled by the server (see
      # ai/deployment-runbook.md): the target host holds no GitHub
      # credential of any kind and never initiates contact with GitHub —
      # DEPLOY_SSH_KEY, already required for the step below, is the only
      # credential crossing the CI-to-server boundary. `--delete` on the
      # directory sync keeps docker/postgres an exact mirror of this commit
      # rather than accruing files a later migration removed.
      - name: Copy compose files to the server
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/taskflow' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "mkdir -p '$DEPLOY_PATH/docker/postgres'"
          rsync -az -e 'ssh -o StrictHostKeyChecking=accept-new' \
            compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.prod.yaml"
          rsync -az --delete -e 'ssh -o StrictHostKeyChecking=accept-new' \
            docker/postgres/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/docker/postgres/"

      # Runs BEFORE the pull rather than after the deploy, because the failure
      # this prevents IS a pull that runs the disk out. Old SHA-tagged images
      # are only a local cache; GHCR retains the SHA-tagged images for rollback.
      #
      # `until=24h` removes unused images and builder cache older than 24 hours.
      # Running containers' images are not removed because they are still in use.
      #
      # Housekeeping is deliberately non-fatal: a cleanup failure must not
      # prevent an otherwise valid deployment.
      - name: Reclaim disk on the target host
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker image prune -af --filter 'until=24h' || true; \
             docker builder prune -af --filter 'until=24h' || true; \
             df -h /; docker system df"

      # ensure-roles BEFORE migrate, migrate BEFORE recreating the app
      # containers — none of these are side effects app startup triggers,
      # per compose.prod.yaml's own header and the runbook. `--profile
      # tools` is required for both: they sit behind that profile
      # deliberately, so a plain `up -d` elsewhere in this job (there isn't
      # one — see below) could never run either by accident.
      #
      # ensure-roles creates any Postgres role this deploy's migrations need
      # that does not exist yet on THIS cluster — see
      # docker/postgres/ensure-roles.sh's own header for why that can't be
      # migrate's job (taskflow_migrator is deliberately NOCREATEROLE) or
      # 02-roles.sql's (it only runs once, against an empty data directory).
      # When build-push ran, this commit has a real SHA-tagged image to
      # deploy. When it was SKIPPED (a compose/docker-postgres-only push),
      # no image was ever published under this commit's SHA — pinning
      # IMAGE_TAG to it anyway would make the `pull` below fail on a
      # manifest that doesn't exist. `latest` is always the most recently
      # published image in that case, which is also the only image this
      # push could possibly have meant to run: nothing about the images
      # changed, only what the server is running them WITH.
      - name: Ensure roles, migrate, then deploy over SSH
        if: steps.gate.outputs.configured == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/taskflow' }}
          IMAGE_TAG: ${{ needs.build-push.result == 'success' && needs.changes.outputs.sha || 'latest' }}
        run: |
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && \
             IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env.prod -f compose.prod.yaml --profile tools run --rm ensure-roles && \
             IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env.prod -f compose.prod.yaml --profile tools run --rm migrate && \
             IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env.prod -f compose.prod.yaml pull && \
             IMAGE_TAG='$IMAGE_TAG' docker compose --env-file .env.prod -f compose.prod.yaml up -d --remove-orphans"
