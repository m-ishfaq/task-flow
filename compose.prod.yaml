## TaskFlow — production stack for a single VM (ai/pre-launch-hardening.md
## Priority 1; PLAN.md §12/§13's "provider interfaces make relocating a
## redeploy" stance — this targets any Docker host, not a specific cloud).
##
## This file makes the deploy MECHANISM real. It does not supply real secrets,
## a domain, or a TLS certificate — those are an operator's config exercise
## once a host exists (see ai/deployment-runbook.md), not something baked in
## here. Every secret below is a required substitution variable (`${VAR:?}`)
## so a missing one fails `docker compose config` loudly rather than booting
## every service on an empty string.
##
## Usage:
##   docker compose --env-file .env.prod -f compose.prod.yaml build
##   docker compose --env-file .env.prod -f compose.prod.yaml --profile tools run --rm ensure-roles
##   docker compose --env-file .env.prod -f compose.prod.yaml --profile tools run --rm migrate
##   docker compose --env-file .env.prod -f compose.prod.yaml up -d
##
## `migrate` and `coturn` sit behind compose profiles ('tools' / 'turn') so
## neither one starts as a side effect of a plain `up -d` — a migration is an
## explicit step (see the runbook), and TURN is opt-in per RTC_TURN_URLS/
## RTC_TURN_SECRET being set at all. Add `--profile turn` to `up` once those
## are configured.
##
## `.env.prod.example` documents every variable this file substitutes.
##
## What's deliberately NOT here:
## - mailpit — production needs a real SMTP relay (MAIL_HOST etc.), not a
##   local inbox that discards everything it catches.
## - TLS termination — put a certificate in front of the `web` service (a
##   managed load balancer, or Caddy/another nginx doing ACME) rather than
##   baking cert renewal into this file; `web`'s own nginx.conf listens on
##   plain :80, exactly like every other container here talks to its
##   neighbours over the compose network.
## - Postgres role passwords are the ONLY thing this file changes about
##   docker/postgres/init's role/grant model — see
##   docker/postgres/init-prod/05-set-passwords.sh's own header. Everything
##   else about who can do what is the same file dev uses.
##
## ## Why the third-party images carry a digest
##
## The seven `task-flow-*` images are pinned by `${IMAGE_TAG}`, which is a
## commit SHA the CD workflow prints — so what runs in production is always a
## revision someone can look up. The images below are NOT ours, and `:latest`
## is a LABEL the publisher re-points at will: the same compose file pulls
## different bytes on Tuesday than it did on Monday, with nothing in this repo
## recording that anything changed. That is the half of the supply chain the
## IMAGE_TAG discipline does not cover.
##
## So each one is `name:tag@sha256:...`. The digest is what Docker actually
## fetches and verifies; the tag is kept alongside it purely so the line stays
## readable and so Dependabot's `docker-compose` ecosystem
## (.github/dependabot.yml) knows which tag to watch — it opens a PR when the
## publisher moves the tag, which turns "we silently got a new MinIO" into a
## diff with a review on it.
##
## `postgres:17-alpine` is pinned by digest as well — not because a major jump is
## the worry (the `17-alpine` tag already blocks 17 -> 18), but because the
## database is the one stateful service with no rollback escape hatch: if an
## unpinned 17.x patch build broke on a deploy, there is no recorded last-good
## digest to fall back to, and the app's `IMAGE_TAG` rollback does not cover it.
## The cost is a review PR on each routine 17.x patch (~quarterly), which is the
## trade we want for the datastore. Both `postgres` lines below (the DB and the
## `ensure-roles` helper) carry the SAME digest on purpose.
##
## `clamav/clamav:stable` is deliberately left on its tag: it is stateless (a bad
## build is caught by its healthcheck and self-heals on the next rebuild), it
## rebuilds far more often than Postgres patches, and its virus signatures update
## at runtime regardless of the image digest — so pinning would add churn without
## protecting the thing that actually matters.
##
## Updating one is a one-line edit — take the digest from the Dependabot PR, or
##   docker buildx imagetools inspect minio/minio:latest

name: taskflow-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      POSTGRES_DB: taskflow
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
      # Consumed by docker/postgres/init-prod/05-set-passwords.sh, which runs
      # after the role/grant scripts below and touches nothing but passwords.
      TASKFLOW_MIGRATOR_PASSWORD: ${TASKFLOW_MIGRATOR_PASSWORD:?TASKFLOW_MIGRATOR_PASSWORD must be set}
      TASKFLOW_APP_PASSWORD: ${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}
      TASKFLOW_AUDIT_PASSWORD: ${TASKFLOW_AUDIT_PASSWORD:?TASKFLOW_AUDIT_PASSWORD must be set}
      TASKFLOW_REALTIME_PASSWORD: ${TASKFLOW_REALTIME_PASSWORD:?TASKFLOW_REALTIME_PASSWORD must be set}
      TASKFLOW_COLLAB_PASSWORD: ${TASKFLOW_COLLAB_PASSWORD:?TASKFLOW_COLLAB_PASSWORD must be set}
      TASKFLOW_NOTIFICATION_SWEEP_PASSWORD: ${TASKFLOW_NOTIFICATION_SWEEP_PASSWORD:?TASKFLOW_NOTIFICATION_SWEEP_PASSWORD must be set}
      TASKFLOW_BACKLINKS_PASSWORD: ${TASKFLOW_BACKLINKS_PASSWORD:?TASKFLOW_BACKLINKS_PASSWORD must be set}
      TASKFLOW_PLATFORM_ADMIN_PASSWORD: ${TASKFLOW_PLATFORM_ADMIN_PASSWORD:?TASKFLOW_PLATFORM_ADMIN_PASSWORD must be set}
      TASKFLOW_RECORDING_INGEST_PASSWORD: ${TASKFLOW_RECORDING_INGEST_PASSWORD:?TASKFLOW_RECORDING_INGEST_PASSWORD must be set}
      TASKFLOW_SEARCH_PASSWORD: ${TASKFLOW_SEARCH_PASSWORD:?TASKFLOW_SEARCH_PASSWORD must be set}
      TASKFLOW_AUTOMATION_PASSWORD: ${TASKFLOW_AUTOMATION_PASSWORD:?TASKFLOW_AUTOMATION_PASSWORD must be set}
      TASKFLOW_WEBHOOK_PASSWORD: ${TASKFLOW_WEBHOOK_PASSWORD:?TASKFLOW_WEBHOOK_PASSWORD must be set}
      TASKFLOW_API_TOKEN_AUTH_PASSWORD: ${TASKFLOW_API_TOKEN_AUTH_PASSWORD:?TASKFLOW_API_TOKEN_AUTH_PASSWORD must be set}
      TASKFLOW_BILLING_SWEEP_PASSWORD: ${TASKFLOW_BILLING_SWEEP_PASSWORD:?TASKFLOW_BILLING_SWEEP_PASSWORD must be set}
      TASKFLOW_INTEGRATION_AUTH_PASSWORD: ${TASKFLOW_INTEGRATION_AUTH_PASSWORD:?TASKFLOW_INTEGRATION_AUTH_PASSWORD must be set}
      TASKFLOW_OPS_EVENTS_PASSWORD: ${TASKFLOW_OPS_EVENTS_PASSWORD:?TASKFLOW_OPS_EVENTS_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # 01-03: the same role/grant model dev uses, unmodified. 04
      # (test-database) is deliberately excluded — production has no reason
      # to carry a test database or replay grants against it. 05 is the
      # password-rotation script above.
      - ./docker/postgres/init/01-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./docker/postgres/init/02-roles.sql:/docker-entrypoint-initdb.d/02-roles.sql:ro
      - ./docker/postgres/init/03-grants.sql:/docker-entrypoint-initdb.d/03-grants.sql:ro
      - ./docker/postgres/init-prod/05-set-passwords.sh:/docker-entrypoint-initdb.d/05-set-passwords.sh:ro
    command:
      - postgres
      - -c
      - log_min_duration_statement=200
      - -c
      - max_connections=200
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      # Published on the host because presigned URLs are fetched DIRECTLY by
      # the browser (packages/storage) — STORAGE_ENDPOINT in .env.prod must
      # be a publicly reachable URL for this host:port, or point at a real S3/
      # R2 endpoint instead and leave this container running unused. Put TLS
      # in front of 9000 before using this for anything but a first test
      # deploy — an attachment upload over plain HTTP is one to fix before
      # real users touch it.
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" &&
      mc mb --ignore-existing local/taskflow-attachments &&
      mc mb --ignore-existing local/taskflow-exports &&
      mc mb --ignore-existing local/taskflow-recordings &&
      mc anonymous set none local/taskflow-attachments &&
      mc anonymous set none local/taskflow-exports &&
      mc anonymous set none local/taskflow-recordings &&
      echo 'buckets ready (private)';
      "
    restart: 'no'

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s

  # TURN/STUN. Optional — RTC_TURN_URLS/RTC_TURN_SECRET are only set below if
  # the operator supplied them in .env.prod, and the app treats an unset pair
  # as "STUN only" rather than refusing to boot (apps/api/src/config/env.ts's
  # own superRefine). `network_mode: host` for the identical reason
  # compose.yaml's dev coturn uses it — a Docker port mapping cannot cover
  # the per-call relay port RANGE without a userland proxy per port, and the
  # advertised ICE candidates must be addresses the browser can actually
  # reach. Linux-only in this form; see compose.yaml's own note.
  #
  # `${RTC_TURN_SECRET:-CHANGE_ME...}` rather than `:?`, deliberately: compose
  # resolves EVERY service's interpolation before applying `--profile`
  # filtering, so a `:?` here would fail a plain `up -d` with the turn
  # profile inactive. The profile gate is what actually keeps an unconfigured
  # coturn from running — this default only has to be loud, not enforced.
  # Verify RTC_TURN_SECRET is real before ever passing `--profile turn`.
  coturn:
    image: coturn/coturn:latest@sha256:aa68aab64a3b929d57fc2924c98ea447bf996cf8dade2508e7b71eaf23f1f14e
    restart: unless-stopped
    network_mode: host
    profiles: ['turn']
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${RTC_TURN_SECRET:-CHANGE_ME_set_RTC_TURN_SECRET_in_env_prod}
      - --realm=${RTC_TURN_REALM:-taskflow}
      - --min-port=49160
      - --max-port=49200
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255

  # One-shot. NOT part of `up` — the runbook runs this explicitly, before the
  # app services start, and never on every deploy: a migration is a step, not
  # a rolling-deploy side effect. Reuses the api image rather than adding a
  # fifth Dockerfile — packages/db's migrate:up is `tsx`, and the api image
  # already carries the whole workspace source.
  # Runs before `migrate` on every deploy — see docker/postgres/ensure-roles.sh's
  # own header for why this exists as a separate step rather than folding role
  # creation into 02-roles.sql (which only runs once, against an empty data
  # directory) or into `migrate` (taskflow_migrator is deliberately
  # NOCREATEROLE). Connects as the Postgres SUPERUSER, on the same `postgres`
  # image already pulled for the database itself — no extra image to build.
  ensure-roles:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    profiles: ['tools']
    environment:
      PGHOST: postgres
      PGPORT: '5432'
      POSTGRES_USER: postgres
      PGPASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?POSTGRES_SUPERUSER_PASSWORD must be set}
      POSTGRES_DB: taskflow
      TASKFLOW_MIGRATOR_PASSWORD: ${TASKFLOW_MIGRATOR_PASSWORD:?TASKFLOW_MIGRATOR_PASSWORD must be set}
      TASKFLOW_APP_PASSWORD: ${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}
      TASKFLOW_AUDIT_PASSWORD: ${TASKFLOW_AUDIT_PASSWORD:?TASKFLOW_AUDIT_PASSWORD must be set}
      TASKFLOW_REALTIME_PASSWORD: ${TASKFLOW_REALTIME_PASSWORD:?TASKFLOW_REALTIME_PASSWORD must be set}
      TASKFLOW_COLLAB_PASSWORD: ${TASKFLOW_COLLAB_PASSWORD:?TASKFLOW_COLLAB_PASSWORD must be set}
      TASKFLOW_NOTIFICATION_SWEEP_PASSWORD: ${TASKFLOW_NOTIFICATION_SWEEP_PASSWORD:?TASKFLOW_NOTIFICATION_SWEEP_PASSWORD must be set}
      TASKFLOW_BACKLINKS_PASSWORD: ${TASKFLOW_BACKLINKS_PASSWORD:?TASKFLOW_BACKLINKS_PASSWORD must be set}
      TASKFLOW_PLATFORM_ADMIN_PASSWORD: ${TASKFLOW_PLATFORM_ADMIN_PASSWORD:?TASKFLOW_PLATFORM_ADMIN_PASSWORD must be set}
      TASKFLOW_RECORDING_INGEST_PASSWORD: ${TASKFLOW_RECORDING_INGEST_PASSWORD:?TASKFLOW_RECORDING_INGEST_PASSWORD must be set}
      TASKFLOW_SEARCH_PASSWORD: ${TASKFLOW_SEARCH_PASSWORD:?TASKFLOW_SEARCH_PASSWORD must be set}
      TASKFLOW_AUTOMATION_PASSWORD: ${TASKFLOW_AUTOMATION_PASSWORD:?TASKFLOW_AUTOMATION_PASSWORD must be set}
      TASKFLOW_WEBHOOK_PASSWORD: ${TASKFLOW_WEBHOOK_PASSWORD:?TASKFLOW_WEBHOOK_PASSWORD must be set}
      TASKFLOW_API_TOKEN_AUTH_PASSWORD: ${TASKFLOW_API_TOKEN_AUTH_PASSWORD:?TASKFLOW_API_TOKEN_AUTH_PASSWORD must be set}
      TASKFLOW_BILLING_SWEEP_PASSWORD: ${TASKFLOW_BILLING_SWEEP_PASSWORD:?TASKFLOW_BILLING_SWEEP_PASSWORD must be set}
      TASKFLOW_INTEGRATION_AUTH_PASSWORD: ${TASKFLOW_INTEGRATION_AUTH_PASSWORD:?TASKFLOW_INTEGRATION_AUTH_PASSWORD must be set}
      TASKFLOW_OPS_EVENTS_PASSWORD: ${TASKFLOW_OPS_EVENTS_PASSWORD:?TASKFLOW_OPS_EVENTS_PASSWORD must be set}
    volumes:
      - ./docker/postgres/ensure-roles.sh:/ensure-roles.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['sh', '/ensure-roles.sh']

  migrate:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['tools']
    environment:
      <<: *app-env
      DATABASE_MIGRATION_URL: postgresql://taskflow_migrator:${TASKFLOW_MIGRATOR_PASSWORD:?TASKFLOW_MIGRATOR_PASSWORD must be set}@postgres:5432/taskflow
    depends_on:
      postgres:
        condition: service_healthy
    # tsx directly, not `pnpm --filter @taskflow/db migrate:up` -- the api
    # image has carried no pnpm binary since apps/api/Dockerfile's runtime
    # stage dropped corepack/pnpm entirely (round 6 of the CD CVE fixes,
    # commit e9757ca), and this service was never updated to match. Nothing
    # caught it because Deploy only runs after build-push + Trivy both pass,
    # and Trivy stayed red on every push in between -- so this line ran for
    # the first time only once the image scan was actually clean, and it
    # failed immediately: node:22-alpine's own entrypoint script silently
    # prepends `node` to an unrecognized command, so `pnpm ...` became
    # `node pnpm ...` and Node tried to load a module literally named
    # `/app/pnpm`, which never existed. Same fix apps/api/Dockerfile's own
    # CMD already uses for the same reason.
    command: ['packages/db/node_modules/.bin/tsx', 'packages/db/src/migrate/cli.ts', 'up']

  # One-shot, manual only — never part of `up -d`, matching `migrate`'s own
  # profile gating. Reuses the api image (full monorepo source, tsx runs
  # directly -- see `migrate`'s own comment above for why there is no pnpm
  # in this image) with its OWN environment block instead of inheriting
  # api's, so the seed CLI (invoked via `entrypoint` below, plus whatever
  # flags the caller types) reads every secret straight from THIS FILE's
  # own `${VAR}` substitution against
  # .env.prod — never a hand-typed `-e VAR=$SHELL_VAR`, which is exactly how
  # a SASL "password must be a string" failure happened twice in a row: a
  # shell variable that only ever existed inside .env.prod, not the calling
  # shell, silently expanded to an empty string.
  #
  # `entrypoint` (not `command`) is deliberate: `docker compose run seed
  # <args>` only replaces the COMMAND half of `entrypoint + command`, so
  # everything typed after the service name reaches the seed CLI's own flags
  # directly:
  #   docker compose --profile tools run --rm seed --reset --profile showcase --seed demo1
  # — nothing else to type, no -e flags, no shell interpolation.
  seed:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: ['tools']
    environment:
      # NOT `<<: *app-env` — that anchor sets NODE_ENV: production, and the
      # seeder's own assertSafeToSeed() (packages/seed/src/cli.ts) hard-
      # refuses to run against one. This is the ONE service in this file
      # that deliberately runs as development, on purpose, against the
      # production database, over the ordinary taskflow_migrator connection.
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}

      DATABASE_MIGRATION_URL: postgresql://taskflow_migrator:${TASKFLOW_MIGRATOR_PASSWORD:?TASKFLOW_MIGRATOR_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_PLATFORM_ADMIN_URL: postgresql://taskflow_platform_admin:${TASKFLOW_PLATFORM_ADMIN_PASSWORD:?TASKFLOW_PLATFORM_ADMIN_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_AUDIT_URL: postgresql://taskflow_audit:${TASKFLOW_AUDIT_PASSWORD:?TASKFLOW_AUDIT_PASSWORD must be set}@postgres:5432/taskflow

      MASTER_KEY_ID: ${MASTER_KEY_ID:?MASTER_KEY_ID must be set}
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 must be set}

      # Optional — attachments are skipped gracefully if these are blank
      # (packages/seed/src/modules/platform.attachments.ts). Deliberately
      # NOT ${STORAGE_ENDPOINT} here, unlike api/worker: that value is the
      # PUBLIC endpoint browsers use for presigned URLs (compose.prod.yaml's
      # own comment on minio's `ports:`), and this container sits on the same
      # Docker network as `minio` itself — hairpinning back out through the
      # public IP to reach a container one hop away routinely times out on
      # cloud hosts (the VM can't always reach its own public address). This
      # is only correct for the self-hosted minio service below; if
      # STORAGE_ENDPOINT ever points at a real external S3/R2 provider
      # instead, change this back to ${STORAGE_ENDPOINT} — an external
      # endpoint has no internal Docker hostname to reach it by.
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-}
      STORAGE_BUCKET_ATTACHMENTS: taskflow-attachments
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}

      # Optional — telephony data is skipped gracefully if these are blank.
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TELEPHONY_INDEX_KEY: ${TELEPHONY_INDEX_KEY:-}

      # billing.catalog (packages/seed/src/modules/billing.catalog.ts) writes
      # REAL Stripe Products/Prices when PAYMENTS_PROVIDER=stripe and a key is
      # present — SEED_PAYMENTS=fake forces the in-memory processor instead
      # for a showcase run that should never touch the real Stripe account.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      SEED_PAYMENTS: ${SEED_PAYMENTS:-}

      # Optional — omitting either skips the platform-operator account
      # entirely (packages/seed/src/modules/identity.users.ts's own
      # null-is-skip contract).
      SEED_PLATFORM_ADMIN_EMAIL: ${SEED_PLATFORM_ADMIN_EMAIL:-}
      SEED_PLATFORM_ADMIN_PASSWORD: ${SEED_PLATFORM_ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
    # tsx directly, not `pnpm --filter @taskflow/seed seed` -- see
    # `migrate`'s own comment above for why there is no pnpm in this image.
    entrypoint: ['packages/seed/node_modules/.bin/tsx', 'packages/seed/src/cli.ts']

  api:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-api:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://taskflow_app:${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_AUDIT_URL: postgresql://taskflow_audit:${TASKFLOW_AUDIT_PASSWORD:?TASKFLOW_AUDIT_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_BACKLINKS_URL: postgresql://taskflow_backlinks:${TASKFLOW_BACKLINKS_PASSWORD:?TASKFLOW_BACKLINKS_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_NOTIFICATION_SWEEP_URL: postgresql://taskflow_notification_sweep:${TASKFLOW_NOTIFICATION_SWEEP_PASSWORD:?TASKFLOW_NOTIFICATION_SWEEP_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_PLATFORM_ADMIN_URL: postgresql://taskflow_platform_admin:${TASKFLOW_PLATFORM_ADMIN_PASSWORD:?TASKFLOW_PLATFORM_ADMIN_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_RECORDING_INGEST_URL: postgresql://taskflow_recording_ingest:${TASKFLOW_RECORDING_INGEST_PASSWORD:?TASKFLOW_RECORDING_INGEST_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_API_TOKEN_URL: postgresql://taskflow_api_token_auth:${TASKFLOW_API_TOKEN_AUTH_PASSWORD:?TASKFLOW_API_TOKEN_AUTH_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_SEARCH_URL: postgresql://taskflow_search:${TASKFLOW_SEARCH_PASSWORD:?TASKFLOW_SEARCH_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_OPS_EVENTS_URL: postgresql://taskflow_ops_events:${TASKFLOW_OPS_EVENTS_PASSWORD:?TASKFLOW_OPS_EVENTS_PASSWORD must be set}@postgres:5432/taskflow
      # taskflow_integration_auth already gets a real password from
      # ensure-roles/05-set-passwords; nothing handed it a connection string
      # until now, which is why the connector webhook routes answered 503
      # even with SLACK_/GITHUB_CONNECTOR_* credentials set below — see
      # .env.prod.example's own "NOT WIRED INTO compose.prod.yaml" note.
      DATABASE_INTEGRATION_URL: postgresql://taskflow_integration_auth:${TASKFLOW_INTEGRATION_AUTH_PASSWORD:?TASKFLOW_INTEGRATION_AUTH_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?STORAGE_ENDPOINT must be set — a publicly reachable S3-compatible endpoint; see minio's own port comment}
      STORAGE_REGION: ${STORAGE_REGION:-auto}
      STORAGE_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      STORAGE_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      STORAGE_BUCKET_ATTACHMENTS: taskflow-attachments
      STORAGE_BUCKET_EXPORTS: taskflow-exports
      STORAGE_BUCKET_RECORDINGS: taskflow-recordings
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      STORAGE_MAX_UPLOAD_BYTES: ${STORAGE_MAX_UPLOAD_BYTES:-26214400}

      CLAMAV_HOST: clamav
      CLAMAV_PORT: 3310

      MAIL_HOST: ${MAIL_HOST:?MAIL_HOST must be set — a real SMTP relay, not mailpit}
      MAIL_PORT: ${MAIL_PORT:?MAIL_PORT must be set}
      MAIL_SECURE: ${MAIL_SECURE:-true}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM must be set}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_VALIDATE_RECIPIENT_DOMAIN: ${MAIL_VALIDATE_RECIPIENT_DOMAIN:-false}

      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}

      # Phase 10 Wave 4 — Slack/GitHub automation connectors. A SEPARATE
      # Slack app and GitHub OAuth app from the sign-in ones above (different
      # scope, never shared credentials — apps/api/src/config/env.ts's own
      # comment). All optional: an unconfigured provider's connect route
      # answers NOT_FOUND rather than the app failing to boot.
      SLACK_CONNECTOR_CLIENT_ID: ${SLACK_CONNECTOR_CLIENT_ID:-}
      SLACK_CONNECTOR_CLIENT_SECRET: ${SLACK_CONNECTOR_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      GITHUB_CONNECTOR_CLIENT_ID: ${GITHUB_CONNECTOR_CLIENT_ID:-}
      GITHUB_CONNECTOR_CLIENT_SECRET: ${GITHUB_CONNECTOR_CLIENT_SECRET:-}
      INTEGRATION_WEBHOOK_ORIGIN: ${INTEGRATION_WEBHOOK_ORIGIN:-}

      MASTER_KEY_ID: ${MASTER_KEY_ID:?MASTER_KEY_ID must be set}
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 must be set — generate with the command in .env.prod.example, never reuse the dev value}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate with the command in .env.prod.example, never reuse the dev value}

      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_VERIFY_SERVICE_SID: ${TWILIO_VERIFY_SERVICE_SID:-}
      TELEPHONY_DEFAULT_SPEND_CAP_CENTS: ${TELEPHONY_DEFAULT_SPEND_CAP_CENTS:-2500}
      TELEPHONY_MAX_SPEND_CAP_CENTS: ${TELEPHONY_MAX_SPEND_CAP_CENTS:-50000}
      TELEPHONY_WEBHOOK_ORIGIN: ${TELEPHONY_WEBHOOK_ORIGIN:-}
      TELEPHONY_INDEX_KEY: ${TELEPHONY_INDEX_KEY:-}

      RTC_STUN_URLS: ${RTC_STUN_URLS:-stun:stun.l.google.com:19302}
      RTC_TURN_URLS: ${RTC_TURN_URLS:-}
      RTC_TURN_SECRET: ${RTC_TURN_SECRET:-}
      RTC_TURN_TTL_SECONDS: ${RTC_TURN_TTL_SECONDS:-600}
      RTC_TURN_ISSUANCE_CAP_PER_DAY: ${RTC_TURN_ISSUANCE_CAP_PER_DAY:-500}
      RTC_ICE_TRANSPORT_POLICY: ${RTC_ICE_TRANSPORT_POLICY:-all}
      RTC_MAX_RECORDING_BYTES: ${RTC_MAX_RECORDING_BYTES:-67108864}
      RECORDING_INGEST_ENABLED: ${RECORDING_INGEST_ENABLED:-false}

      API_PORT: 3000
      API_HOST: 0.0.0.0
      # nginx (the `web` service) is exactly one hop in front of this
      # service on this topology — see ai/deployment-runbook.md. Trusting a
      # count rather than `true` is what keeps per-IP rate limits from
      # becoming opt-out (apps/api/src/config/trust-proxy.ts).
      API_TRUST_PROXY: ${API_TRUST_PROXY:-1}

      RETENTION_SWEEP_ENABLED: ${RETENTION_SWEEP_ENABLED:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set to the real public origin, e.g. https://app.example.com}

      # Billing (Phase 12 Wave 3/4). PAYMENTS_PROVIDER defaults to `fake`, same
      # as apps/api/src/config/env.ts's own default — an instance with neither
      # STRIPE_SECRET_KEY nor STRIPE_WEBHOOK_SECRET set boots clean on the
      # in-memory provider. Setting PAYMENTS_PROVIDER=stripe without both keys
      # is refused at boot by deps.ts, the TELEPHONY_WEBHOOK_ORIGIN precedent —
      # never a silent fallback to `fake` mid-deployment.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BILLING_TRIAL_DAYS: ${BILLING_TRIAL_DAYS:-14}
      BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-7}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — `localhost` resolves to ::1 first on
      # Alpine while these services listen on IPv4, so wget is refused despite
      # the process being up. Found by the first real `up`: the web image had
      # exactly this failure, and this block (which OVERRIDES the Dockerfile's
      # own HEALTHCHECK) carried the same bug on all three backends.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3000/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  realtime:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-realtime:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/realtime/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://taskflow_app:${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_REALTIME_URL: postgresql://taskflow_realtime:${TASKFLOW_REALTIME_PASSWORD:?TASKFLOW_REALTIME_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      REALTIME_PORT: 3001
      REALTIME_HOST: 0.0.0.0
      REALTIME_TRUST_PROXY: ${REALTIME_TRUST_PROXY:-1}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set}
      REALTIME_REAUTH_LEAD_SECONDS: ${REALTIME_REAUTH_LEAD_SECONDS:-60}
      REALTIME_POLL_INTERVAL_MS: ${REALTIME_POLL_INTERVAL_MS:-5000}
      REALTIME_MAX_CONNECTIONS_PER_IP_PER_MINUTE: ${REALTIME_MAX_CONNECTIONS_PER_IP_PER_MINUTE:-30}
      REALTIME_MAX_JOINS_PER_MINUTE: ${REALTIME_MAX_JOINS_PER_MINUTE:-60}
      REALTIME_MAX_REFUSED_JOINS_PER_MINUTE: ${REALTIME_MAX_REFUSED_JOINS_PER_MINUTE:-10}
      REALTIME_MAX_SIGNALS_PER_MINUTE: ${REALTIME_MAX_SIGNALS_PER_MINUTE:-600}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — same reasoning as the api service's own
      # healthcheck comment above.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3001/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  collab:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-collab:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/collab/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://taskflow_app:${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_COLLAB_URL: postgresql://taskflow_collab:${TASKFLOW_COLLAB_PASSWORD:?TASKFLOW_COLLAB_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      COLLAB_PORT: 3002
      COLLAB_HOST: 0.0.0.0
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN must be set}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — same reasoning as the api service's own
      # healthcheck comment above.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3002/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The background worker (ai/phase-10-automation.md §9 decision 1). Runs NEW
  # background work only — the automation engine, webhook delivery, and later
  # the analytics rollup refresh. The seven existing loops stay inside `api`;
  # running a second consumer process is what `FOR UPDATE SKIP LOCKED` and the
  # per-consumer `outbox_dispatch` were built for, so the two do not contend.
  #
  # No `ports:` — nothing outside the compose network ever calls this service.
  # The port it does listen on carries health probes and nothing else, which is
  # why `web` does not depend on it and `nginx.conf` has no route to it.
  worker:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://taskflow_app:${TASKFLOW_APP_PASSWORD:?TASKFLOW_APP_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_AUTOMATION_URL: postgresql://taskflow_automation:${TASKFLOW_AUTOMATION_PASSWORD:?TASKFLOW_AUTOMATION_PASSWORD must be set}@postgres:5432/taskflow
      DATABASE_WEBHOOK_URL: postgresql://taskflow_webhook:${TASKFLOW_WEBHOOK_PASSWORD:?TASKFLOW_WEBHOOK_PASSWORD must be set}@postgres:5432/taskflow
      # Without this the trial/grace-expiry sweep never starts, so no trial and
      # no grace period ever expires — a billing-lapsed org keeps full access
      # indefinitely, and the process still reports healthy. Required here for
      # that reason, unlike the two claim URLs above: those degrade to "a
      # feature does not run", this one degrades to "an enforcement boundary
      # does not run".
      DATABASE_BILLING_SWEEP_URL: postgresql://taskflow_billing_sweep:${TASKFLOW_BILLING_SWEEP_PASSWORD:?TASKFLOW_BILLING_SWEEP_PASSWORD must be set}@postgres:5432/taskflow
      # The worker's own copy of the grace window — the sweep computes each
      # past_due deadline from it, and apps/api validates the same value
      # independently (their env schemas are deliberately separate).
      BILLING_PAST_DUE_GRACE_DAYS: ${BILLING_PAST_DUE_GRACE_DAYS:-7}
      # How long before a trial ends the owner is warned — this process sends
      # it, apps/api never reads it.
      BILLING_TRIAL_ENDING_WARNING_HOURS: ${BILLING_TRIAL_ENDING_WARNING_HOURS:-72}
      # The period-close job bills usage overage through this — the SAME
      # PAYMENTS_PROVIDER/STRIPE_SECRET_KEY apps/api validates (see api's own
      # comment above). Disagreeing between the two services is the dangerous
      # state: set both or neither.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      DATABASE_OPS_EVENTS_URL: postgresql://taskflow_ops_events:${TASKFLOW_OPS_EVENTS_PASSWORD:?TASKFLOW_OPS_EVENTS_PASSWORD must be set}@postgres:5432/taskflow
      # The worker decrypts webhook signing secrets at delivery, so it holds
      # the same master key pair the API holds — the same variables, same
      # meaning.
      MASTER_KEY_ID: ${MASTER_KEY_ID:?MASTER_KEY_ID must be set}
      MASTER_KEY_BASE64: ${MASTER_KEY_BASE64:?MASTER_KEY_BASE64 must be set — generate with the command in .env.prod.example, never reuse the dev value}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      WORKER_PORT: 3003
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost — same reasoning as the api service's own
      # healthcheck comment above.
      test: ['CMD', 'wget', '-q', '-O-', 'http://127.0.0.1:3003/health/live']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${REGISTRY:-ghcr.io/m-ishfaq}/task-flow-web:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      # Host :80 -> container :8080. The container listens on 8080, not 80,
      # because apps/web/Dockerfile runs nginx as a non-root user
      # (nginxinc/nginx-unprivileged, per Trivy's AVD-DS-0002 finding), which
      # can't bind a privileged port — that's purely internal, nothing
      # changes for anyone hitting the app from outside. Plain HTTP on the
      # host side too: put TLS termination in front of this (a managed load
      # balancer, or another reverse proxy doing ACME) — see this file's own
      # header and ai/deployment-runbook.md.
      #
      # WEB_HOST_BIND/WEB_HOST_PORT default to every interface on port 80,
      # matching the runbook's documented first-deploy flow (curl the bare
      # host on :80 before TLS exists at all). Once a reverse proxy owns the
      # public :80/:443 — Caddy, another nginx doing ACME — BOTH must change:
      # WEB_HOST_BIND=127.0.0.1 *and* WEB_HOST_PORT to something other than
      # 80 (e.g. 8080). Binding to loopback alone is not enough and is not a
      # race condition either, despite reading like one: Caddy's own ACME
      # setup binds *:80 (every interface — including 127.0.0.1), a wildcard
      # that already covers whatever WEB_HOST_BIND says, so this container
      # deterministically fails with "address already in use" every time,
      # regardless of start order, for as long as it also asks for port 80.
      # Found live, on a real deploy, after `ai/deployment-runbook.md`'s own
      # TLS section said the opposite for a while — the Caddyfile's
      # `reverse_proxy` target must point at the SAME non-80 port this line
      # ends up bound to.
      - '${WEB_HOST_BIND:-0.0.0.0}:${WEB_HOST_PORT:-80}:8080'
    depends_on:
      - api
      - realtime
      - collab

  # Live log viewer (ai/deployment-runbook.md's logging section) — read-only,
  # no state of its own, so it carries no volume and needs no backup. Bound to
  # 127.0.0.1 ONLY, with no `:-0.0.0.0` fallback the way `web` has one: `web`
  # needs a brief public window before TLS exists (see its own port comment),
  # a log stream never does, so this has no bare-host-on-:80-first-deploy
  # excuse to default open. Put it behind the reverse proxy's own basic-auth
  # (Caddy `basicauth` directive, configured on the VM — not in this repo,
  # for the same reason no Caddyfile lives here) at a path such as `/logs`,
  # same as every other service on this box: the proxy is the one thing that
  # ever reaches host `:80`/`:443`.
  #
  # That auth is INFRASTRUCTURE-level and deliberately outside the app's own
  # login and role system — it does not reuse `taskflow_platform_admin`
  # (Phase 12 Wave 1's in-app operator role) or any org-owner credential.
  # Dozzle has no concept of a Postgres role or a tRPC session to check, and
  # Caddy's basicauth runs before a request ever reaches this container, so
  # there is no code path by which an in-app org owner's password could open
  # it. One shared operator credential, known only to whoever runs this box.
  #
  # The docker socket mount is read-only, but reading it is still reading
  # every container's logs — including, if a log line ever leaks one, a
  # secret `packages/observability`'s `REDACTION_PATHS` didn't anticipate.
  # That is exactly what the basic-auth gate above exists to bound.
  #
  # DOZZLE_BASE must match the proxy path this sits behind (ai/deployment-
  # runbook.md's `/logs` example). Dozzle's own index.html links its JS/CSS/
  # manifest with root-absolute paths — `/main-<hash>.js`, not a path
  # relative to wherever it's mounted — so proxying it under a subpath
  # without this renders a blank page: the browser requests those assets
  # from the domain ROOT instead of the subpath, and (on this stack) the
  # `web` service's own SPA fallback answers with ITS index.html instead,
  # a 404-that-looks-like-someone-else's-app rather than a load failure.
  # DOZZLE_BASE tells Dozzle to render every asset and API path under the
  # given prefix instead. The Caddy side must then use `handle`, not
  # `handle_path` — `handle_path` strips the matched prefix before
  # forwarding, which would hand Dozzle a request it no longer recognizes
  # as under its own base.
  dozzle:
    image: amir20/dozzle:latest@sha256:243666b0593ff33ed1373901575236f0d6bed8a2d6b451cdae4345969a7b6d5c
    restart: unless-stopped
    environment:
      DOZZLE_NO_ANALYTICS: 'true'
      DOZZLE_BASE: ${DOZZLE_BASE:-/logs}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - '${DOZZLE_HOST_BIND:-127.0.0.1}:${DOZZLE_HOST_PORT:-8081}:8080'

volumes:
  postgres-data:
  minio-data:
  clamav-data:
