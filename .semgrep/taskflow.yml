## Architecture-specific Semgrep rules.
##
## Deliberately narrow. Generic taint rules come from `--config auto`; these
## encode invariants that only mean something in THIS codebase, which is where
## the real risk lives, and the reason losing CodeQL on a private repo (see
## PLAN.md 8.8) costs less than it sounds.
##
## Overlap with the ESLint guardrails is intentional. ESLint sees TypeScript;
## Semgrep also sees SQL migrations, YAML, and Dockerfiles, where several of the
## highest-impact mistakes actually happen.
##
## Path patterns are leading-slash anchored to the repo root on purpose. The
## unanchored form is being reinterpreted in Semgrep's Gitignore-compatible path
## handling, and a rule whose paths silently stop matching is a rule you believe
## is protecting you while it scans nothing.
##
## Verified by scripts/verify-semgrep-rules.mjs, which runs these rules against
## deliberately-bad fixtures and asserts each one fires — and separately asserts
## they stay silent on correct code.

## ---------------------------------------------------------------------------
## THE THREE SQL RLS RULES LIVED HERE, AND DO NOT ANY MORE.
##
## `tenant-table-without-force-rls`, `rls-policy-without-nullif` and
## `rls-policy-without-with-check` moved to scripts/check-migration-rls.mjs.
## They are not weakened — they run on every push now rather than only when the
## tiered security jobs do.
##
## They were removed because all three are CORRELATIONS between statements far
## apart in a file (a CREATE TABLE here, its ALTER ... FORCE eighty lines
## below), and generic mode expresses that as `pattern-not-inside: ... FORCE ROW
## LEVEL SECURITY ...` — an ellipsis with a bounded line span. The suppression
## silently stops applying once a CREATE TABLE block grows past it.
##
## The rules were written and verified in Phase 1, when the only migrations that
## existed were identity tables with no org_id column, so the "no false
## positives on real migrations" assertion had nothing to assert against. Every
## tenant migration from 0004 on then reported a false positive — 25 of them —
## and because the security jobs default to off, nothing ran to say so until a
## scheduled sweep did.
##
## Do not reintroduce them here. A rule that flags correct code trains people to
## mute the scanner, which is strictly worse than no rule. Semgrep keeps what it
## is good at: matching a pattern within a single expression, below.
## ---------------------------------------------------------------------------

rules:
  # ---------------------------------------------------------------------------
  # withGlobalScope bypasses tenant scoping by design. Legitimate only for
  # genuinely pre-tenant operations, all of which live in identity.
  # ---------------------------------------------------------------------------
  - id: global-scope-outside-identity
    languages: [typescript]
    severity: ERROR
    paths:
      include:
        - '/apps/**'
        - '/packages/**'
        - '/.semgrep/fixtures/**'
      exclude:
        # The real location of the identity module. This list previously named
        # two speculative paths that never existed - the rule was written before
        # the code, and neither guess matched where it landed. A path-scoped rule
        # whose scope is wrong reports every legitimate call and nothing else.
        - '/apps/api/src/identity/**'
        - '/packages/db/**'
        # The platform-operator console (Phase 12 §3.6) — cross-tenant by
        # design, matching the equivalent ESLint exemption in
        # packages/config/eslint/security.js's `exempt-global-scope-consumers`
        # block.
        - '/apps/api/src/platform-admin/**'
        - '**/*.test.ts'
        # Deliberate violations, asserted by packages/guardrail-selftest.
        - '/packages/guardrail-selftest/**'
    pattern: withGlobalScope(...)
    message: >-
      withGlobalScope has no tenant scoping and is restricted to pre-tenant
      operations (login by email, invitation tokens, public share links). If a
      scoped query returned nothing, that is usually RLS working correctly and
      the org context being wrong. Do not reach for this. See PLAN.md 8.3.

## ---------------------------------------------------------------------------
## Deferred to Phase 7 (Voice & Messaging):
##
##   twilio-webhook-without-signature-check - flag an inbound webhook handler in
##   apps/api/src/modules/comms that parses the body without first calling
##   validateTwilioSignature. Forged webhooks are the entry point to the most
##   expensive failure mode in the system (PLAN.md 8.5).
##
## Deliberately NOT written speculatively. A rule authored against code that
## does not exist cannot be tested, and a security rule believed to be running
## while silently matching nothing is worse than no rule at all: the same
## failure the guardrail self-test exists to prevent (PLAN.md 2.3). Write it in
## Phase 7 against real handlers, with a fixture proving it fires.
## ---------------------------------------------------------------------------
