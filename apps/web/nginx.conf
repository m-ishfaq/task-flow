# Production edge for apps/web — the static bundle, plus a reverse proxy for
# /trpc, /socket.io, /collab and /telephony onto the three backend services.
#
# This is NOT a convenience layer, it is a security requirement: the
# `__Host-taskflow_refresh` cookie is `SameSite=Strict` (apps/api/src/identity
# /cookies.ts), so the API has to be same-origin with the app in production
# exactly as it is in development. apps/web/vite.config.ts's own `server.proxy`
# block is the source of truth for the path list and the `changeOrigin: false`
# behaviour this file reproduces — see that file's header for the full
# reasoning. Upstream hostnames below are the service names compose.prod.yaml
# defines (api / realtime / collab), matching how Docker's embedded DNS
# resolves them inside the compose network.

worker_processes auto;

# This file replaces nginxinc/nginx-unprivileged's own nginx.conf wholesale
# (the Dockerfile COPYs straight over /etc/nginx/nginx.conf), which silently
# drops the base image's `pid /tmp/nginx.pid;` — set there specifically
# because /run is not writable by the unprivileged `nginx` user this image
# runs as. Without restating it, nginx falls back to the compiled-in default
# (/var/run/nginx.pid) and fails at startup: "open() /run/nginx.pid failed
# (13: Permission denied)" — found by the first real container run, since
# `docker compose config`/build never execute nginx itself.
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;

  gzip on;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript
    text/xml application/xml application/xml+rss text/javascript;

  # Docker's embedded DNS resolves compose service names; resolving at request
  # time (rather than once at nginx startup) means this container does not
  # need restarting when a backend service's container is recreated.
  resolver 127.0.0.11 valid=30s;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  server {
    # 8080, not 80 — nginxinc/nginx-unprivileged (see apps/web/Dockerfile's
    # header) runs as a non-root user, which can't bind a privileged port.
    # compose.prod.yaml maps the host's :80 to this container's :8080, so
    # nothing changes for anyone hitting the app from outside.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API — see file header. No path rewrite (no trailing path on
    # proxy_pass), matching vite's proxy exactly: the full request path,
    # including /trpc itself, reaches the target unchanged.
    location /trpc {
      set $upstream_api api:3000;
      # $upstream_api is a hardcoded literal set one line above, never a
      # value derived from the request (no $http_*, no $arg_*) — the `set`
      # indirection exists only so `resolver` (above) re-resolves Docker's
      # compose-network DNS per request instead of once at nginx startup.
      # This rule's actual concern — a proxy target an attacker can steer —
      # does not apply to any of the four proxy_pass lines in this file.
      # The suppression MUST be on this same line — Semgrep does not honor a
      # nosemgrep comment on a preceding line, only a trailing one (confirmed
      # the hard way: a preceding-line version of this comment still failed
      # CI's Static analysis job on the first push).
      proxy_pass http://$upstream_api; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Carrier webhooks (Twilio) — plain Fastify routes, not tRPC. See
    # vite.config.ts's own note: TELEPHONY_WEBHOOK_ORIGIN must match this
    # public origin, since the signature is verified against a configured
    # value rather than derived from request headers.
    location /telephony {
      set $upstream_api api:3000;
      # Hardcoded literal, not request-derived — see /trpc above.
      proxy_pass http://$upstream_api; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Billing webhooks (Stripe) — a plain Fastify route, not tRPC, matching
    # /telephony above. Stripe's signature does not cover the URL (unlike
    # Twilio's), so unlike /telephony this path carries no TARGET_ORIGIN
    # correctness requirement — but it still needs to reach the api
    # container rather than falling through to the SPA's `location /`
    # catch-all below, which would answer 200 with index.html and make
    # Stripe believe delivery succeeded while nothing was ever processed.
    location /webhooks {
      set $upstream_api api:3000;
      # Hardcoded literal, not request-derived — see /trpc above.
      proxy_pass http://$upstream_api; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # apps/realtime — Socket.io, WebSocket upgrade required.
    location /socket.io {
      set $upstream_realtime realtime:3001;
      # Hardcoded literal, not request-derived — see /trpc above.
      proxy_pass http://$upstream_realtime; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # apps/collab — Hocuspocus over a raw WebSocket, same upgrade requirement.
    location /collab {
      set $upstream_collab collab:3002;
      # Hardcoded literal, not request-derived — see /trpc above.
      proxy_pass http://$upstream_collab; # nosemgrep: generic.nginx.security.dynamic-proxy-host.dynamic-proxy-host
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
    }

    # Fingerprinted build assets — safe to cache forever; a new deploy ships
    # new filenames rather than mutating these.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }

    # The SPA shell. `try_files` falls through to index.html for any path the
    # static bundle doesn't have a file for, so TanStack Router's client-side
    # routes (e.g. a deep link to /projects/abc) resolve instead of 404ing —
    # nginx has never heard of that path, only the router has.
    location / {
      try_files $uri /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}
