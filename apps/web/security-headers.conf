# Security response headers (PLAN.md §8.7, "Header hardening").
#
# In its own file because of an nginx rule that is exactly the trap
# packages/config/eslint/security.js documents for ESLint flat config:
#
#   > These directives are inherited from the previous configuration level if
#   > and only if there are NO add_header directives defined on the current
#   > level.
#
# So a `location` block that sets one Cache-Control header silently drops
# every security header inherited from `server` — and the two locations that
# do exactly that here are `/assets/` and `/`, the second of which serves the
# SPA shell. The headers would have been present on the API proxy paths and
# absent on the actual application, which is the worst possible half.
#
# One file, included at every level that needs it, so there is one place to
# audit and no way to fix a header in three places and miss the fourth.
#
# `always` on every directive: without it nginx omits the header on error
# responses, which are the ones an attacker is most likely to be looking at.
#
# HSTS is deliberately NOT here. This container serves plain HTTP behind a
# TLS-terminating proxy (compose.prod.yaml's own note), so
# Strict-Transport-Security belongs on the hop that owns the certificate.

add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' ws: wss: https:; worker-src 'self' blob:" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;
