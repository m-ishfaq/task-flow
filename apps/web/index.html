<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Referrer leakage: a card URL contains ids that name a tenant's data, and
         the default policy sends the full URL to any third-party origin an
         embedded image or link reaches. -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <!-- The default mark (`public/favicon.svg`). `branding-provider.tsx`
         swaps this link for an operator-uploaded favicon when one is set —
         this entry only stops the browser's bare /favicon.ico 404. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>TaskFlow</title>
  </head>
  <body class="h-full bg-surface text-ink antialiased">
    <div id="root" class="h-full overflow-y-hidden"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
