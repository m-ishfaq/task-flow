## TaskFlow — local development stack (PLAN.md §12)
##
## Everything here is DEVELOPMENT ONLY. Credentials are fixed and public on
## purpose so the stack is reproducible; production secrets come from the
## secrets manager and never from this file.
##
##   docker compose up -d          start
##   docker compose down           stop (keeps data)
##   docker compose down -v        stop and destroy data

name: taskflow

services:
  postgres:
    image: postgres:17-alpine
    container_name: taskflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskflow
      # Deterministic collation — index ordering must not vary by host locale.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      # 5433 on the HOST, 5432 inside the container.
      #
      # Not cosmetic. A machine with PostgreSQL installed natively — which is
      # what the pgAdmin installer bundles, and what a Homebrew or apt postgres
      # leaves running — already has a service on 5432 that starts at boot,
      # before Docker. Docker still registers the mapping and `docker port`
      # reports success, but the socket belongs to the other server, so every
      # connection lands in the wrong database.
      #
      # The failure is disguised: that server has no `taskflow_app` role, and
      # Postgres answers a MISSING role with "password authentication failed"
      # rather than "no such user", deliberately, so the error cannot be used to
      # enumerate accounts. So the symptom is a credentials error against
      # credentials that are provably correct.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    command:
      # Surface slow queries locally so they are found before production.
      - postgres
      - -c
      - log_min_duration_statement=100
      - -c
      - log_statement=none
      - -c
      - max_connections=100
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d taskflow']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Catches every outbound email. Web UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    container_name: taskflow-mailpit
    restart: unless-stopped
    environment:
      MP_MAX_MESSAGES: 500
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8025/readyz']
      interval: 10s
      timeout: 5s
      retries: 5

  # S3-compatible object storage, standing in for Cloudflare R2 (§5).
  # Console at http://localhost:9001
  minio:
    image: minio/minio:latest
    container_name: taskflow-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: taskflow
      MINIO_ROOT_PASSWORD: taskflow-dev-secret
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # Creates the buckets on first run, then exits.
  minio-init:
    image: minio/mc:latest
    container_name: taskflow-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 taskflow taskflow-dev-secret &&
      mc mb --ignore-existing local/taskflow-attachments &&
      mc mb --ignore-existing local/taskflow-exports &&
      mc mb --ignore-existing local/taskflow-recordings &&
      mc anonymous set none local/taskflow-attachments &&
      mc anonymous set none local/taskflow-exports &&
      mc anonymous set none local/taskflow-recordings &&
      echo 'buckets ready (private)';
      "
    restart: 'no'

  # Virus scanning for the upload pipeline (§8.4). An attachment is not
  # downloadable until this has looked at it.
  #
  # Speaks the ClamAV INSTREAM protocol on 3310. The image takes a couple of
  # minutes on first start to load its signature database, which is why the
  # healthcheck has a long start_period — a scan attempted before clamd is
  # ready fails closed, so a short one would make uploads flaky rather than
  # fast.
  clamav:
    image: clamav/clamav:stable
    container_name: taskflow-clamav
    restart: unless-stopped
    environment:
      # Signature updates are a background download; local development does not
      # need them and they make the container slow and noisy to start.
      CLAMAV_NO_FRESHCLAMD: 'true'
    ports:
      - '3310:3310'
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh || exit 1']
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 180s

  # TURN/STUN for in-app voice (Phase 13, ai/phase-13-webrtc.md §5).
  #
  # An explicit `ports:` list, NOT `network_mode: host` — compose.prod.yaml's
  # own coturn block still uses host networking, for the reason its comment
  # gives (TURN allocates a fresh UDP port per relayed stream out of a wide
  # range; a Docker port mapping publishing that whole range costs a userland
  # proxy process per port, and takes noticeably longer to start). That
  # reasoning holds on a real Linux host, which is what production is. It does
  # NOT hold here: confirmed live, against a real phone, that under Docker
  # Desktop (Windows/Mac) `network_mode: host` binds coturn to the DESKTOP
  # VM's own loopback/bridge addresses — `127.0.0.1`, `192.168.65.x`,
  # `172.1x.0.1` — never the actual machine's LAN interface, so nothing
  # outside the machine itself, a real phone included, can ever reach it. The
  # slower startup this trades for is a one-time `docker compose up` cost, not
  # a per-call one; the alternative (host networking, silently unreachable
  # from any other device) is not an alternative at all for testing this
  # feature against a real phone rather than two browser tabs.
  #
  # `--external-ip` is the other half, and skipping it just moves the same
  # bug: without it, coturn advertises the CONTAINER's own bridge-network
  # address in every candidate — this file's own next paragraph already names
  # the symptom ("a relayed candidate naming a bridge-network IP is accepted
  # by the client, tried, and silently times out"). Unset, it defaults to
  # `127.0.0.1`, which is exactly right for two browser tabs on this same
  # machine (`RTC_STUN_URLS`'s own default points there too) and exactly
  # wrong for a phone; set `COTURN_EXTERNAL_IP` in `.env` to the same LAN IP
  # `MOBILE_API_BASE_URL`/`RTC_STUN_URLS`/`RTC_TURN_URLS` already use before
  # testing against a real device.
  #
  # A relayed candidate naming a bridge-network IP is accepted by the client,
  # tried, and silently times out, which presents as "calls do not connect"
  # with nothing in any log — the reason `--external-ip` above is not
  # optional the moment this container is not host-networked.
  #
  # `use-auth-secret` is the whole reason this can be developed against safely:
  # no static user exists, so there is no credential to leak from the client
  # bundle. The server mints a `<expiry>:<session-id>` / HMAC-SHA1 pair per
  # call (packages/security/src/turn-credential.ts).
  coturn:
    image: coturn/coturn:latest
    container_name: taskflow-coturn
    restart: unless-stopped
    ports:
      - '3478:3478/udp'
      - '3478:3478/tcp'
      - '49160-49200:49160-49200/udp'
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --fingerprint
      - --use-auth-secret
      # DEV ONLY, and public on purpose like every other credential in this
      # file. Must match RTC_TURN_SECRET in .env.
      - --static-auth-secret=coturn-dev-secret
      - --realm=taskflow.local
      # See the header on why this is not optional under port mapping.
      - --external-ip=${COTURN_EXTERNAL_IP:-127.0.0.1}
      # A narrow relay range keeps the container's startup fast. Production
      # wants the full default range; this is a development convenience.
      - --min-port=49160
      - --max-port=49200
      # Refuse to relay to loopback, this-network and link-local addresses. An
      # open TURN server is an SSRF pivot into whatever network it sits on —
      # the relay will happily carry traffic to 127.0.0.1:5432 or a cloud
      # metadata endpoint at 169.254.169.254 if allowed to. These three are
      # the ones that actually matter for that risk, dev included.
      - --no-multicast-peers
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      # RFC1918 (the private ranges a phone/desktop on a home or office LAN
      # actually sits in) is EXPLICITLY ALLOWED here, dev only —
      # compose.prod.yaml's own coturn block still denies all three, unchanged.
      # Found live: with them denied, coturn refused to relay to a real
      # phone's own LAN address ("A peer IP ... denied in the range:
      # 10.0.0.0-10.255.255.255"), which made local testing against a real
      # device impossible — the whole point `network_mode: host` and
      # COTURN_EXTERNAL_IP above already exist for. `--allowed-peer-ip`
      # overrides a matching `--denied-peer-ip` — confirmed against coturn's
      # own docs ("if there is an allowed rule that fits the address, then it
      # is allowed, no matter what") — so this is a carved-out exception, not
      # a removal of the SSRF control: "relay to another device on my own dev
      # LAN" is exactly what local testing needs and is not a meaningful
      # protection in that context to begin with; "relay to loopback or cloud
      # metadata" (denied above) is the part that actually matters, and stays
      # denied even here.
      - --allowed-peer-ip=172.16.0.0-172.31.255.255
      - --allowed-peer-ip=192.168.0.0-192.168.255.255
      - --allowed-peer-ip=10.0.0.0-10.255.255.255

volumes:
  postgres-data:
  minio-data:
  clamav-data:
